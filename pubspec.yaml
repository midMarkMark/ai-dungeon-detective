name: ai_dungeon_detective
description: "AI Dungeon Detective - An AI-powered murder mystery investigation game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.4.2
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^8.0.0
  provider: ^6.1.1
  equatable: ^2.0.5
  uuid: ^4.3.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/