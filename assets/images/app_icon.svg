<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A843;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8923A;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" stroke="url(#goldGradient)" stroke-width="4"/>
  
  <!-- Outer decorative ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- Magnifying glass handle -->
  <path d="M340 340 L400 400" stroke="url(#goldGradient)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Magnifying glass lens -->
  <circle cx="280" cy="280" r="70" fill="url(#bgGradient)" stroke="url(#goldGradient)" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Lens reflection -->
  <path d="M230 230 Q250 230 255 245 Q260 260 245 270" fill="none" stroke="#D4A843" stroke-width="3" opacity="0.6"/>
  
  <!-- Detective hat silhouette -->
  <path d="M180 180 Q256 120 332 180" fill="url(#bgGradient)" stroke="url(#goldGradient)" stroke-width="3" filter="url(#glow)"/>
  <path d="M160 180 L180 180 Q256 120 332 180 L352 180" fill="none" stroke="url(#goldGradient)" stroke-width="3"/>
  <ellipse cx="256" cy="180" rx="92" ry="12" fill="url(#goldGradient)" opacity="0.2"/>
  
  <!-- Hat band -->
  <path d="M185 182 Q256 140 327 182" fill="none" stroke="#D4A843" stroke-width="4" opacity="0.8"/>
  
  <!-- Eye/monocle in the lens -->
  <circle cx="280" cy="280" r="25" fill="none" stroke="url(#goldGradient)" stroke-width="3" opacity="0.7"/>
  <circle cx="280" cy="280" r="12" fill="url(#goldGradient)" opacity="0.9"/>
  <circle cx="276" cy="276" r="4" fill="#0A0A0A"/>
  
  <!-- Fingerprint lines in background (subtle) -->
  <g opacity="0.05" stroke="#D4A843" stroke-width="1.5" fill="none">
    <path d="M100 300 Q150 280 200 300 Q250 320 300 300 Q350 280 400 300"/>
    <path d="M100 330 Q150 310 200 330 Q250 350 300 330 Q350 310 400 330"/>
    <path d="M100 360 Q150 340 200 360 Q250 380 300 360 Q350 340 400 360"/>
  </g>
  
  <!-- "AI" text small at bottom -->
  <text x="256" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="url(#goldGradient)" letter-spacing="4">AI</text>
</svg>